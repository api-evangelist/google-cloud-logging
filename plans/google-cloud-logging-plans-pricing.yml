specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Google Cloud Logging
providerId: google-cloud-logging
created: '2026-05-04'
modified: '2026-09-12'
generated: '2026-09-12'
method: searched
source: https://cloud.google.com/stackdriver/pricing
note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold, which invented a tiered "Free / Pro" plan
  structure with a 1,000-requests-per-month quota that Google has never published. Cloud
  Logging has NO request-priced plan tiers: it is usage-priced by data volume, with one free
  allotment per project per month. Every figure below is quoted from the provider's own
  Observability pricing summary, read 2026-09-12.
tags:
  - Cloud
  - Logging
  - Monitoring
  - Observability
description: >-
  Cloud Logging pricing. There are no subscription tiers and no per-call pricing — billing is
  a one-time ingestion charge per GiB streamed into log bucket storage (which includes 30 days
  of storage, querying and analysis at no extra charge), plus an optional per-GiB-per-month
  charge for retention beyond 30 days. The Log Router and Log Analytics are free.
pricing_model: usage-based
billing_unit: GiB ingested
plan_count: 1
plans:
  - id: google-cloud-logging-usage
    name: Cloud Logging (usage-based)
    type: usage-based
    currency: USD
    billing_period: month
    description: >-
      The only plan. Priced on data volume ingested into log bucket storage, with a free
      allotment applied per Google Cloud project per month.
    free_allotment:
      amount: 50
      unit: GiB
      scope: per project per month
      applies_to: Logging storage (except vended network logs)
      effective_date: '2018-07-01'
    entries:
      - label: Logging storage
        name: logging_storage
        type: usage
        metric: GiB ingested
        price: '0.50'
        currency: USD
        unit: GiB
        free_allotment: 50 GiB/project/month
        effective_date: '2018-07-01'
        description: >-
          One-time charge for streaming logs into log bucket storage for indexing, querying and
          analysis; includes up to 30 days of storage in log buckets. No additional charges for
          querying and analyzing log data.
      - label: Vended network logs storage
        name: vended_network_logs_storage
        type: usage
        metric: GiB ingested
        price: '0.25'
        currency: USD
        unit: GiB
        free_allotment: null
        effective_date: '2024-10-01'
        description: >-
          One-time charge for streaming network telemetry logs into log bucket storage;
          includes up to 30 days of storage. No free allotment applies.
      - label: Logging retention
        name: logging_retention
        type: usage
        metric: GiB per month retained
        price: '0.01'
        currency: USD
        unit: GiB/month
        effective_date: '2022-01-01'
        description: >-
          Charged per GiB per month for logs retained more than 30 days, billed monthly
          according to retention. Logs kept for the default retention period incur no retention
          cost.
      - label: Log Router
        name: log_router
        type: usage
        price: '0.00'
        description: No additional charge.
      - label: Log Analytics
        name: log_analytics
        type: usage
        price: '0.00'
        description: No additional charge.
trial:
  program: Google Cloud Free Program
  credit: USD 300 in free credits
  url: https://cloud.google.com/free
  note: Platform-wide trial credit, not a Cloud Logging-specific trial.
quota_reference: rate-limits/google-cloud-logging-rate-limits.yml
