aid: google-cloud-logging
name: Google Cloud Logging
description: >-
  Google Cloud Logging is a fully managed, real-time log management service that ingests,
  stores, searches, analyzes, routes and alerts on application and system log data at scale
  across Google Cloud, AWS and on-premises environments. The v2 API writes log entries and
  manages the configuration surface behind them — log buckets and views, Log Router sinks and
  exclusions, logs-based metrics, log scopes, linked BigQuery datasets and CMEK settings.
  Google publishes it as a Discovery document with 254 methods, as first-party gRPC service
  definitions, through seven official client libraries and the gcloud logging command group,
  and — since April 2026 — through a fully managed remote MCP server at
  logging.googleapis.com/mcp that exposes six read-only tools to agents.
