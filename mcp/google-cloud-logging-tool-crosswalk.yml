description: >-
  Binds every tool published by the Cloud Logging remote MCP server to the REST operation
  behind it. Two surfaces are compared: the nine refined OpenAPI documents in openapi/ (15
  operations, an API Evangelist subset) and Google's own Discovery document (254 methods,
  revision 20260818), which is the authoritative REST contract. Where an MCP tool has no
  operation in our OpenAPI subset but does have one in the Discovery document, the row says so
  rather than claiming a gap that does not exist.
