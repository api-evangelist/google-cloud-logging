    description: >-
      Use this as the primary tool to search and retrieve log entries from Google Cloud
      Logging. It's essential for debugging application behavior, finding specific error
      messages, or auditing events.
    input_schema_properties: [filter, orderBy, pageSize, pageToken, projectIds, resourceNames]
    annotations: {readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false}
    rest_method: logging.entries.list
