surface_shape:
  read_only: true
  note: >-
    All six published tools carry readOnlyHint true. The MCP surface is a READ projection of
    Cloud Logging: it can search entries and inspect buckets/views, but it exposes no
    entries.write, no sink/exclusion/metric mutation and no delete. An agent cannot write or
    destroy log data through this server.
