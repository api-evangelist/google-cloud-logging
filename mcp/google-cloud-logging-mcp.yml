- name: list_log_entries
  description: 'Use this as the primary tool to search and retrieve log entries from Google Cloud Logging.
    It''s essential for debugging application behavior, finding specific error messages, or auditing events.
    The ''filter'' is powerful and can be used to select logs by severity, resource type, text content,
    and more. IMPORTANT: This tool will only work with a single resource project at a time. Calls with
    multiple resource projects will fail.'
  input_schema_properties:
  - filter
  - orderBy
  - pageSize
  - pageToken
  - projectIds
  - resourceNames
  annotations:
