description: >-
  Cloud Logging has NO test-mode/live-mode separation. There is no sandbox host, no test key
  prefix, no magic test identifiers and no fixture tooling — every call goes to production
  logging.googleapis.com against a real Google Cloud project. What stands in for a sandbox is
  a throwaway project inside the free tier, where the first 50 GiB of log storage per project
  per month is free.
test_live_separation:
  supported: false
  key_prefixes: null
  note: >-
    Credentials are OAuth tokens over a real project. Isolation is achieved by using a separate
    Google Cloud project, not by a mode flag.
