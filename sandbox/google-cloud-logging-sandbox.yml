test_values_note: >-
  Google publishes no magic test log names, test resource ids or simulator values. Nothing is
  invented here; the field is empty because the provider publishes nothing to put in it.
safe_rehearsal:
  approach: throwaway-project-and-scratch-log
  steps:
    - Create or select a disposable Google Cloud project.
    - gcloud logging write my-test-log "A simple entry"
    - gcloud logging read "logName=projects/PROJECT_ID/logs/my-test-log" --limit 10
    - gcloud logging logs delete my-test-log
  docs: https://docs.cloud.google.com/logging/docs/write-query-log-entries-gcloud
