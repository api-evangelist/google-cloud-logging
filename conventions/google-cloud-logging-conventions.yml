  authentication: authentication/google-cloud-logging-authentication.yml
  scopes: scopes/google-cloud-logging-scopes.yml
  errors: errors/google-cloud-logging-problem-types.yml
  lifecycle: lifecycle/google-cloud-logging-lifecycle.yml
